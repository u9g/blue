name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proto:
    name: Proto lint + generated code is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run proto:lint
      # v1 only grows: no field or RPC may be removed or renumbered.
      - run: bunx buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - run: bun run proto:ts
      - run: uv sync --locked --project voice
      - run: uv run --project voice python voice/scripts/gen_proto.py
      - name: Fail if generated code is stale
        run: git diff --exit-code -- bridge/src/gen voice/src/blue

  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # Server tests create a database per test through this admin DSN.
      BLUE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bridge:
    name: Bridge (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: bridge
      - run: bun test
        working-directory: bridge

  voice:
    name: Voice agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q

  handshake:
    name: Daemon ⇄ compiled bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: bridge
      # Blue requires Claude Code to be installed already; doctor fails without it.
      # `--version` needs no login.
      - run: npm install -g @anthropic-ai/claude-code
      - run: cargo run -q -p blue-daemon -- doctor --bridge target/bridge/claude-bridge${{ runner.os == 'Windows' && '.exe' || '' }}
      # The daemon driving the compiled bridge through a recorded session (no Claude login).
      - run: cargo test -q -p blue-daemon --test replay -- --ignored
      # Server + daemon processes end to end, killing each mid-turn. Postgres comes from
      # postgresql_embedded; the token avoids GitHub API rate limits on its download.
      - run: cargo build -q -p blue-daemon
      - run: cargo test -q -p blue-server --test e2e -- --ignored
        env:
          GITHUB_TOKEN: ${{ github.token }}
