# TypeScript codegen for the bridge. Rust is generated by crates/protocol/build.rs and
# Python by `just proto-py`; see the justfile.
version: v2
clean: true
inputs:
  - directory: proto
    paths:
      - proto/blue/bridge
plugins:
  - local: protoc-gen-es
    out: bridge/src/gen
    opt:
      - target=ts
      - import_extension=ts
