[project]
name = "blue-voice"
version = "0.1.0"
description = "Blue's LiveKit voice agent: the conversational front end to the Blue server."
requires-python = ">=3.12, <3.15"
dependencies = [
    "grpcio~=1.84",
    "livekit-agents~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "protobuf>=6.31",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `blue` is the generated protobuf package (see scripts/gen_proto.py).
packages = ["src/blue_voice", "src/blue"]

[tool.uv]
# From LiveKit's agent-starter-python: yarl 1.24.1 shipped only a cp310 wheel.
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/blue"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
